<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6DDE3">
<title>Our Little Frame ♡</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%97%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="paper-bg" aria-hidden="true"></div>
<div id="floaty" aria-hidden="true"></div>

<!-- Login / loading gate -->
<div id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-card">
    <div class="gate-icon" aria-hidden="true">💌</div>
    <h1>Hi, love</h1>
    <p id="gate-msg" class="hand">This little world is just for us.</p>
    <label>Email <input id="gate-email" type="email" autocomplete="username" required></label>
    <label>Password <input id="gate-pass" type="password" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Come in ♡</button>
    <p id="gate-err" class="err" role="alert"></p>
  </form>
</div>

<div id="demo-banner" class="demo-banner" hidden></div>

<div class="toolbar" id="toolbar">
  <button class="tool" id="btn-sound" aria-pressed="false" title="Sound (off)">🔇<span class="sr">Sound</span></button>
  <button class="tool" id="btn-admin" hidden title="Edit the frame">✏️<span class="sr">Editor</span></button>
  <button class="tool" id="btn-out" hidden title="Sign out">👋<span class="sr">Sign out</span></button>
</div>

<main id="app" hidden>
  <header class="hero">
    <div class="doodles" aria-hidden="true">
      <svg class="doodle d1" viewBox="0 0 60 60"><g fill="#D99AAA"><circle cx="30" cy="12" r="9"/><circle cx="48" cy="30" r="9"/><circle cx="30" cy="48" r="9"/><circle cx="12" cy="30" r="9"/></g><circle cx="30" cy="30" r="8" fill="#E8D3A2"/></svg>
      <svg class="doodle d2" viewBox="0 0 60 60"><g fill="#C9D8C0"><circle cx="30" cy="12" r="9"/><circle cx="48" cy="30" r="9"/><circle cx="30" cy="48" r="9"/><circle cx="12" cy="30" r="9"/></g><circle cx="30" cy="30" r="8" fill="#F6DDE3"/></svg>
      <svg class="doodle d3" viewBox="0 0 24 24"><path fill="#E8D3A2" d="M12 1l2.6 7.4L22 11l-7.4 2.6L12 21l-2.6-7.4L2 11l7.4-2.6z"/></svg>
      <svg class="doodle d4" viewBox="0 0 24 24"><path fill="#D99AAA" d="M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z"/></svg>
    </div>
    <p class="eyebrow hand">for you, today &amp; always</p>
    <h1 id="hero-title">Happy 23rd Birthday, My Love ♡</h1>
    <p id="hero-sub" class="hand sub"></p>
    <article id="hero-letter" class="letter-card"></article>
    <a href="#chapters" class="scroll-cue hand">Our story continues below ↓</a>
  </header>

  <p class="motto"><span>Some moments are too special to be opened before their time.</span></p>

  <section id="chapters" aria-label="Milestone frame"></section>

  <section id="extras" class="extras" aria-label="Little extras"></section>

  <footer class="foot hand">made with all my love ♡</footer>
</main>

<div id="modal-root"></div>
<aside id="drawer" class="drawer" hidden aria-label="Editor"></aside>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/scratch.js"></script>
<script src="js/app.js"></script>
<script src="js/admin.js"></script>
<script>OF.boot();</script>
</body>
</html>
